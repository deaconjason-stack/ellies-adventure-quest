plugins {
    id 'com.android.application'
}

android {
    namespace 'com.medisyncd.starhopgame'
    compileSdk 35

    defaultConfig {
        applicationId 'com.medisyncd.starhopgame'
        minSdk 24
        targetSdk 35
        versionCode 40
        versionName '4.0'
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
