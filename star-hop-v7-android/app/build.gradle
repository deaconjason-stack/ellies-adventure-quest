plugins { id 'com.android.application' }

android {
    namespace 'com.medisyncd.starhopquest'
    compileSdk 35

    defaultConfig {
        applicationId 'com.medisyncd.starhopquest'
        minSdk 24
        targetSdk 35
        versionCode 70
        versionName '7.0'
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
