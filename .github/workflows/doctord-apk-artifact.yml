name: DoctorD APK Artifact

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/doctord-apk-artifact.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Install Android native components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Download DoctorD builder
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 "https://at.adobe.com/A1XK5QQgDSrb4z2U" -o /tmp/DoctorD_v19_Android_APK_Builder.zip
          unzip -q /tmp/DoctorD_v19_Android_APK_Builder.zip -d "$GITHUB_WORKSPACE"
          test -f "$GITHUB_WORKSPACE/doctord_mobile_builder/build-apk.sh"

      - name: Build DoctorD APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/doctord_mobile_builder"
          bash build-apk.sh

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/doctord_mobile_builder/output/DoctorD-v19.0.0-Android.apk"
          test -s "$APK"
          echo "APK_SIZE_BYTES=$(stat -c%s "$APK")"
          echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoctorD-v19.0.0-Android-APK
          path: doctord_mobile_builder/output/DoctorD-v19.0.0-Android.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
