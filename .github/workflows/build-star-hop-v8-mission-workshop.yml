name: Build Star Hop v8 Mission Workshop

on:
  push:
    branches: [ star-hop-v8-mission-workshop ]
    paths:
      - 'star-hop-v8/**'
      - 'star-hop-v8-android/**'
      - '.github/workflows/build-star-hop-v8-mission-workshop.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Reassemble and verify v8 game
        shell: bash
        run: |
          mkdir -p star-hop-v8-android/app/src/main/assets
          cat \
            star-hop-v8/source.part00a.b64gz \
            star-hop-v8/source.part00b.b64gz \
            star-hop-v8/source.part00c.b64gz \
            star-hop-v8/source.part01.b64gz \
            star-hop-v8/source.part02.b64gz \
            > /tmp/starhop-v8.b64
          base64 -d /tmp/starhop-v8.b64 > /tmp/starhop-v8.html.gz
          gzip -dc /tmp/starhop-v8.html.gz > star-hop-v8-android/app/src/main/assets/starhop-v8.html
          echo "be486c84aec82e05b5f5311549bad8d72b54a3cbeccf1a6ae819539d8727551c  star-hop-v8-android/app/src/main/assets/starhop-v8.html" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("star-hop-v8-android/app/src/main/assets/starhop-v8.html").read_text(encoding="utf-8")
          m=re.search(r"<script>([\s\S]*)</script>",s)
          assert m,"Game script missing"
          Path("/tmp/starhop-v8.js").write_text(m.group(1),encoding="utf-8")
          PY
          node --check /tmp/starhop-v8.js
      - name: Build official Android APK
        working-directory: star-hop-v8-android
        run: gradle --no-daemon --stacktrace clean assembleDebug
      - name: Verify modern APK
        shell: bash
        run: |
          APK="star-hop-v8-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/v8-badging.txt
          grep "package: name='com.medisyncd.starhopworkshop'" /tmp/v8-badging.txt
          grep "targetSdkVersion:'35'" /tmp/v8-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p star-hop-v8-android/release
          cp "$APK" star-hop-v8-android/release/Ellie-StarHop-v8-Mission-Workshop.apk
          sha256sum star-hop-v8-android/release/Ellie-StarHop-v8-Mission-Workshop.apk > star-hop-v8-android/release/Ellie-StarHop-v8-Mission-Workshop.sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Ellie-StarHop-v8-Mission-Workshop
          path: |
            star-hop-v8-android/release/Ellie-StarHop-v8-Mission-Workshop.apk
            star-hop-v8-android/release/Ellie-StarHop-v8-Mission-Workshop.sha256.txt
          if-no-files-found: error
          retention-days: 30
