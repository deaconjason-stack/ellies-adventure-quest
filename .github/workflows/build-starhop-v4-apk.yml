name: Build Ellie Star Hop v4 APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'android-star-hop-v4/**'
      - '.github/workflows/build-starhop-v4-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-star-hop-v4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "Using $SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify and unpack Ellie Star Hop v4
        run: |
          cat archive-parts/part1.b64 archive-parts/part2.b64 archive-parts/part3.b64 archive-parts/part4.b64 > star-hop-v4.full.b64
          test "$(wc -c < star-hop-v4.full.b64)" -eq 35440
          base64 -d star-hop-v4.full.b64 > star-hop-v4.zip
          echo "05493927474a6ae2fbbb0f041400607aec414d2954a8bba9b4e94e41b5d2ba72  star-hop-v4.zip" | sha256sum -c -
          rm -rf /tmp/ellie-starhop
          mkdir -p /tmp/ellie-starhop app/src/main/assets
          unzip -q star-hop-v4.zip -d /tmp/ellie-starhop
          cp -R /tmp/ellie-starhop/star-hop/. app/src/main/assets/
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/ellie-starhop-icon.svg

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Ellies-Star-Hop-v4-Engagement.apk
          ls -lh Ellies-Star-Hop-v4-Engagement.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ellies-Star-Hop-v4-Engagement-APK
          path: android-star-hop-v4/Ellies-Star-Hop-v4-Engagement.apk
          if-no-files-found: error
