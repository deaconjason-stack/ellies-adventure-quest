name: Build Star Hop v7 Star Grid Quest

on:
  push:
    branches: [ star-hop-v7-star-grid-quest ]
    paths:
      - 'star-hop-v7/**'
      - 'star-hop-v7-android/**'
      - '.github/workflows/build-star-hop-v7-star-grid-quest.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Reassemble and verify v7 game
        shell: bash
        run: |
          mkdir -p star-hop-v7-android/app/src/main/assets
          cat star-hop-v7/source.part*.b64gz > /tmp/starhop-v7.b64
          base64 -d /tmp/starhop-v7.b64 > /tmp/starhop-v7.html.gz
          gzip -dc /tmp/starhop-v7.html.gz > star-hop-v7-android/app/src/main/assets/starhop-v7.html
          echo "6f2250a81abb5eb53205071c8c2f1b8ea80d2e0994962a696d2126e39a69f673  star-hop-v7-android/app/src/main/assets/starhop-v7.html" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("star-hop-v7-android/app/src/main/assets/starhop-v7.html").read_text(encoding="utf-8")
          m=re.search(r"<script>([\s\S]*)</script>",s)
          assert m,"Game script missing"
          Path("/tmp/starhop-v7.js").write_text(m.group(1),encoding="utf-8")
          PY
          node --check /tmp/starhop-v7.js

      - name: Build official Android APK
        working-directory: star-hop-v7-android
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify modern APK
        shell: bash
        run: |
          APK="star-hop-v7-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/v7-badging.txt
          grep "package: name='com.medisyncd.starhopquest'" /tmp/v7-badging.txt
          grep "targetSdkVersion:'35'" /tmp/v7-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p star-hop-v7-android/release
          cp "$APK" star-hop-v7-android/release/Ellie-StarHop-v7-Star-Grid-Quest.apk
          sha256sum star-hop-v7-android/release/Ellie-StarHop-v7-Star-Grid-Quest.apk > star-hop-v7-android/release/Ellie-StarHop-v7-Star-Grid-Quest.sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Ellie-StarHop-v7-Star-Grid-Quest
          path: |
            star-hop-v7-android/release/Ellie-StarHop-v7-Star-Grid-Quest.apk
            star-hop-v7-android/release/Ellie-StarHop-v7-Star-Grid-Quest.sha256.txt
          if-no-files-found: error
          retention-days: 30
