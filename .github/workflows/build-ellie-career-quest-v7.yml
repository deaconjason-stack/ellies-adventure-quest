name: Build Ellie Career Quest v7 OpenAI

on:
  push:
    branches: [ ellie-career-quest-v7-openai ]
    paths:
      - 'career-quest-v7-build/**'
      - '.github/workflows/build-ellie-career-quest-v7.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Rebuild proven v6 shell
        shell: bash
        run: |
          cat career-quest-v5-build/source.part*.b64 > /tmp/ellie-v5.b64
          base64 -d /tmp/ellie-v5.b64 > /tmp/ellie-v5.zip
          unzip -t /tmp/ellie-v5.zip
          rm -rf career-quest-v6-android career-quest-v7-android
          mkdir career-quest-v6-android
          unzip -q /tmp/ellie-v5.zip -d career-quest-v6-android
          python career-quest-v6-build/upgrade.py
          mv career-quest-v6-android career-quest-v7-android

      - name: Inject live OpenAI Ellie v7
        shell: bash
        run: |
          python career-quest-v7-build/upgrade.py
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("career-quest-v7-android/app/src/main/assets/index.html").read_text()
          m=re.search(r"<script>([\s\S]*)</script>",s)
          assert m, "script missing"
          js=m.group(1)
          Path("/tmp/ellie-v7.js").write_text(js)
          assert "ELLIE_AI_URL" in js
          assert "ellieAiPayload" in js
          assert "fetch(ELLIE_AI_URL" in js
          assert "x-ellie-client" in js
          assert "=>" not in js
          PY
          node --check /tmp/ellie-v7.js

      - name: Build APK
        working-directory: career-quest-v7-android
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="career-quest-v7-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep "package: name='com.medisyncd.elliecareer.ai'" /tmp/badging.txt
          grep "versionCode='7'" /tmp/badging.txt
          grep "targetSdkVersion:'36'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -t "$APK"
          mkdir -p career-quest-v7-android/release
          cp "$APK" career-quest-v7-android/release/Ellies-Career-Quest-v7-OpenAI.apk
          sha256sum career-quest-v7-android/release/Ellies-Career-Quest-v7-OpenAI.apk > career-quest-v7-android/release/Ellies-Career-Quest-v7-OpenAI.sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Ellies-Career-Quest-v7-OpenAI
          path: |
            career-quest-v7-android/release/Ellies-Career-Quest-v7-OpenAI.apk
            career-quest-v7-android/release/Ellies-Career-Quest-v7-OpenAI.sha256.txt
          if-no-files-found: error
          retention-days: 30
