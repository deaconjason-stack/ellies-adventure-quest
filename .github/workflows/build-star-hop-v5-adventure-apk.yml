name: Build Star Hop v5 Adventure APK

on:
  push:
    branches: [ star-hop-v5-adventure-apk ]
    paths:
      - 'star-hop-v5/**'
      - 'star-hop-v5-android/**'
      - '.github/workflows/build-star-hop-v5-adventure-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Reassemble and verify Adventure Missions source
        shell: bash
        run: |
          mkdir -p star-hop-v5-android/app/src/main/assets
          cat             star-hop-v5/part00.b64             star-hop-v5/part01.b64             star-hop-v5/part02.b64             star-hop-v5/part03.b64             star-hop-v5/part04.b64             star-hop-v5/part05.b64             star-hop-v5/part06.b64             star-hop-v5/part07.b64             star-hop-v5/part08.b64             star-hop-v5/part09.b64             star-hop-v5/part10a.b64             star-hop-v5/part10b.b64             star-hop-v5/part10c0.b64             star-hop-v5/part10c1.b64             star-hop-v5/part10d0.b64             star-hop-v5/part10d1.b64             star-hop-v5/part11a.b64             star-hop-v5/part11b.b64             star-hop-v5/part11c.b64             > /tmp/starhop-v5.b64
          base64 -d /tmp/starhop-v5.b64 > star-hop-v5-android/app/src/main/assets/starhop-v5.html
          echo "2a4587c10db2944ecce1a1803ef38fb62a70b962c9ae06378fecfe8ed9ed1af9  star-hop-v5-android/app/src/main/assets/starhop-v5.html" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("star-hop-v5-android/app/src/main/assets/starhop-v5.html")
          s = p.read_text(encoding="utf-8")
          m = re.search(r"<script>([\s\S]*)</script>", s)
          assert m, "Game script not found"
          Path("/tmp/starhop-v5.js").write_text(m.group(1), encoding="utf-8")
          PY
          node --check /tmp/starhop-v5.js

      - name: Build official Android APK
        working-directory: star-hop-v5-android
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify modern APK
        shell: bash
        run: |
          APK="star-hop-v5-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/v5-badging.txt
          grep "package: name='com.medisyncd.starhopadventure'" /tmp/v5-badging.txt
          grep "targetSdkVersion:'35'" /tmp/v5-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p star-hop-v5-android/release
          cp "$APK" star-hop-v5-android/release/Ellie-StarHop-v5-Adventure-Missions.apk
          sha256sum star-hop-v5-android/release/Ellie-StarHop-v5-Adventure-Missions.apk > star-hop-v5-android/release/Ellie-StarHop-v5-Adventure-Missions.sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Ellie-StarHop-v5-Adventure-Missions
          path: |
            star-hop-v5-android/release/Ellie-StarHop-v5-Adventure-Missions.apk
            star-hop-v5-android/release/Ellie-StarHop-v5-Adventure-Missions.sha256.txt
          if-no-files-found: error
          retention-days: 30
