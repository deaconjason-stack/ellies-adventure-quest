name: Build Ellie Paths of Grace

on:
  push:
    branches:
      - ellie-paths-build
    paths:
      - 'apps/ellie-paths-of-grace/**'
      - '.github/workflows/build-ellie-paths-of-grace.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore verified source
        shell: bash
        run: |
          python apps/ellie-paths-of-grace/restore_source.py
          echo "ELLIE_ROOT=$GITHUB_WORKSPACE/apps/ellie-paths-of-grace/restored/Ellie-Paths-of-Grace-CrossPlatform" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Android APK
        run: gradle -p "$ELLIE_ROOT/android" :app:assembleDebug --stacktrace
      - name: Name APK
        run: cp "$ELLIE_ROOT/android/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/Ellie-Paths-of-Grace-v2.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Ellie-Paths-of-Grace-Android-APK
          path: ${{ runner.temp }}/Ellie-Paths-of-Grace-v2.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore verified source
        shell: bash
        run: |
          python apps/ellie-paths-of-grace/restore_source.py
          echo "ELLIE_ROOT=$GITHUB_WORKSPACE/apps/ellie-paths-of-grace/restored/Ellie-Paths-of-Grace-CrossPlatform" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Windows portable
        shell: pwsh
        run: |
          Set-Location "$env:ELLIE_ROOT"
          npm install --no-audit --no-fund
          npx electron-builder --win portable
      - uses: actions/upload-artifact@v4
        with:
          name: Ellie-Paths-of-Grace-Windows
          path: ${{ env.ELLIE_ROOT }}/dist/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore verified source
        shell: bash
        run: |
          python apps/ellie-paths-of-grace/restore_source.py
          echo "ELLIE_ROOT=$GITHUB_WORKSPACE/apps/ellie-paths-of-grace/restored/Ellie-Paths-of-Grace-CrossPlatform" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Linux AppImage
        run: |
          cd "$ELLIE_ROOT"
          npm install --no-audit --no-fund
          npx electron-builder --linux AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: Ellie-Paths-of-Grace-Linux
          path: ${{ env.ELLIE_ROOT }}/dist/*.AppImage
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore verified source
        shell: bash
        run: |
          python apps/ellie-paths-of-grace/restore_source.py
          echo "ELLIE_ROOT=$GITHUB_WORKSPACE/apps/ellie-paths-of-grace/restored/Ellie-Paths-of-Grace-CrossPlatform" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build macOS zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          cd "$ELLIE_ROOT"
          npm install --no-audit --no-fund
          npx electron-builder --mac zip
      - uses: actions/upload-artifact@v4
        with:
          name: Ellie-Paths-of-Grace-macOS
          path: ${{ env.ELLIE_ROOT }}/dist/*.zip
          if-no-files-found: error
